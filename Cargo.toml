[package]
name = "rpc-genie"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "service-macro",
]

[dependencies]
service-macro = { path = "service-macro" }
rmp-serde = "1.3.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
